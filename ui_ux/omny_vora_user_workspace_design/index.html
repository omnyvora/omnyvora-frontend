<!DOCTYPE html>
<html lang="en" data-theme="light" data-tool="account">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omnyvora — Workspace</title>
<link rel="stylesheet" href="colors_and_type.css">
<link rel="stylesheet" href="components.css">
<style>
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg-page); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  #root { height: 100vh; }
  * { box-sizing: border-box; }
  a { text-decoration: none; }
  button { font-family: var(--font-sans); }

  @keyframes omFade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes omPop { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
  @keyframes omToastIn { from { opacity: 0; transform: translateX(12px) } to { opacity: 1; transform: none } }

  ::-webkit-scrollbar { width: 10px; height: 10px }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; border: 3px solid var(--bg-page) }
  ::-webkit-scrollbar-track { background: transparent }

  /* shared utility classes */
  .clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .link-accent { color: var(--accent-text); cursor: pointer; font-weight: 500; transition: opacity var(--duration-fast) var(--ease); }
  .link-accent:hover { opacity: .75; }

  /* hover: color/border/shadow only — no size or position change (DS rule) */
  .app-card { transition: border-color var(--duration-fast) var(--ease), box-shadow var(--duration-fast) var(--ease); }
  .app-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-2); }
  .row-hover { transition: border-color var(--duration-fast) var(--ease), background var(--duration-fast) var(--ease); }
  .row-hover:hover { border-color: var(--border-strong); }
  .notif-item:hover { filter: brightness(0.985); }
  [data-theme="dark"] .notif-item:hover { filter: brightness(1.15); }
  .subnav-item[data-active="0"]:hover { background: var(--bg-surface) !important; color: var(--text-primary) !important; }

  image-slot { --image-slot-bg: var(--bg-surface); }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="image-slot.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="app/icons.jsx"></script>
<script type="text/babel" src="app/ui.jsx"></script>
<script type="text/babel" src="app/data.jsx"></script>
<script type="text/babel" src="app/Cards.jsx"></script>
<script type="text/babel" src="app/Layout.jsx"></script>
<script type="text/babel" src="app/Sidebar.jsx"></script>
<script type="text/babel" src="app/Dashboard.jsx"></script>
<script type="text/babel" src="app/Applications.jsx"></script>
<script type="text/babel" src="app/Profile.jsx"></script>
<script type="text/babel" src="app/Account.jsx"></script>
<script type="text/babel" src="app/Overlays.jsx"></script>
<script type="text/babel" src="app/App.jsx"></script>
</body>
</html>
