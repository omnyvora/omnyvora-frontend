<!DOCTYPE html>
<!-- @dsCard group="Components" name="Toast / notification" subtitle="success · error w/ dismiss" viewport="700x150" --><html data-theme="light" data-tool="portfolio"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="../components.css">
<style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-sans);background:var(--bg-page);color:var(--text-primary);-webkit-font-smoothing:antialiased}.wrap{padding:18px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}body{background:var(--bg-surface)}.wrap{gap:12px}</style></head><body><div class="wrap">
  <div class="toast toast--success"><span class="toast__icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 11 3 3L22 4"/></svg></span><div class="toast__body"><div class="toast__title">Profile saved</div><div class="toast__msg">Your changes are live.</div></div><button class="toast__close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
  <div class="toast toast--error"><span class="toast__icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></span><div class="toast__body"><div class="toast__title">Upload failed</div><div class="toast__msg">File exceeds 25 MB limit.</div></div><button class="toast__close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
</div></body></html>
