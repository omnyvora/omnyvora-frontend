<!DOCTYPE html>
<!-- @dsCard group="Components" name="Modal" subtitle="header / body / footer + scrim" viewport="700x280" --><html data-theme="light" data-tool="portfolio"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="../components.css">
<style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-sans);background:var(--bg-page);color:var(--text-primary);-webkit-font-smoothing:antialiased}
  .scrim{position:absolute;inset:0;background:rgba(17,17,17,0.45);display:flex;align-items:center;justify-content:center}
  .modal{width:420px;background:var(--bg-overlay);border-radius:var(--radius-modal);box-shadow:var(--shadow-3);overflow:hidden;border:0.5px solid var(--border-default)}
  .m-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:0.5px solid var(--border-default)}
  .m-b{padding:20px}.m-f{display:flex;justify-content:flex-end;gap:10px;padding:16px 20px;border-top:0.5px solid var(--border-default)}
</style></head><body>
  <div class="scrim">
    <div class="modal">
      <div class="m-h"><div class="ds-display-sm">Delete project?</div><button class="btn btn--ghost btn--sm" style="width:32px;padding:0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
      <div class="m-b"><div class="ds-body-md" style="color:var(--text-secondary)">This permanently removes “Q3 Launch” and all of its assets. This action can’t be undone.</div></div>
      <div class="m-f"><button class="btn btn--secondary btn--sm">Cancel</button><button class="btn btn--danger btn--sm">Delete</button></div>
    </div>
  </div>
</body></html>
