<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Gray primitives" subtitle="10-step neutral ramp · gray-950 → white" viewport="700x120" -->
<html data-theme="light" data-tool="portfolio">
<head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-sans);background:var(--bg-page);color:var(--text-primary);-webkit-font-smoothing:antialiased}
  .wrap{padding:20px 22px}
  .swatch-row{display:flex;gap:0}
  .sw{flex:1;height:54px;display:flex;align-items:flex-end;padding:6px}
  .sw span{font:500 9px/1 var(--font-mono);opacity:.0}
  .grid{display:flex;gap:10px;flex-wrap:wrap}
  .chip{display:flex;flex-direction:column;gap:6px;width:96px}
  .chip .box{height:48px;border-radius:8px;border:0.5px solid var(--border-default)}
  .chip .n{font:500 11px/1.3 var(--font-sans)}
  .chip .h{font:400 10px/1 var(--font-mono);color:var(--text-tertiary)}
  
</style></head><body><div class="wrap"><div class="swatch-row" style="border-radius:10px;overflow:hidden;border:0.5px solid var(--border-default)"><div class="sw" style="background:#111111;color:#fff"><span style="opacity:1">950</span></div><div class="sw" style="background:#1A1A1A;color:#fff"><span style="opacity:1">900</span></div><div class="sw" style="background:#2A2A2A;color:#fff"><span style="opacity:1">800</span></div><div class="sw" style="background:#444444;color:#fff"><span style="opacity:1">700</span></div><div class="sw" style="background:#666666;color:#fff"><span style="opacity:1">500</span></div><div class="sw" style="background:#999999;color:#111"><span style="opacity:1">400</span></div><div class="sw" style="background:#CCCCCC;color:#111"><span style="opacity:1">200</span></div><div class="sw" style="background:#E8E8E8;color:#111"><span style="opacity:1">100</span></div><div class="sw" style="background:#F6F6F6;color:#111"><span style="opacity:1">50</span></div><div class="sw" style="background:#FFFFFF;color:#111"><span style="opacity:1">white</span></div></div><div style="margin-top:12px;display:flex;justify-content:space-between;font:400 10px/1 var(--font-mono);color:var(--text-tertiary)"><span>#111111</span><span>#1A1A1A</span><span>#2A2A2A</span><span>#444444</span><span>#666666</span><span>#999999</span><span>#CCCCCC</span><span>#E8E8E8</span><span>#F6F6F6</span><span>#FFFFFF</span></div></div></body></html>
