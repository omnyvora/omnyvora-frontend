<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Status colors" subtitle="Success · error · warning · info (solid + subtle)" viewport="700x120" -->
<html data-theme="light" data-tool="portfolio">
<head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-sans);background:var(--bg-page);color:var(--text-primary);-webkit-font-smoothing:antialiased}
  .wrap{padding:20px 22px}
  .swatch-row{display:flex;gap:0}
  .sw{flex:1;height:54px;display:flex;align-items:flex-end;padding:6px}
  .sw span{font:500 9px/1 var(--font-mono);opacity:.0}
  .grid{display:flex;gap:10px;flex-wrap:wrap}
  .chip{display:flex;flex-direction:column;gap:6px;width:96px}
  .chip .box{height:48px;border-radius:8px;border:0.5px solid var(--border-default)}
  .chip .n{font:500 11px/1.3 var(--font-sans)}
  .chip .h{font:400 10px/1 var(--font-mono);color:var(--text-tertiary)}
  
</style></head><body><div class="wrap"><div class="grid"><div class="chip" style="width:140px"><div style="display:flex;border-radius:8px;overflow:hidden;border:0.5px solid var(--border-default)"><div style="flex:1;height:48px;background:#1DB37B"></div><div style="flex:1;height:48px;background:#DCFCE7"></div></div><div class="n">Success</div><div class="h">green-500 / green-50</div></div><div class="chip" style="width:140px"><div style="display:flex;border-radius:8px;overflow:hidden;border:0.5px solid var(--border-default)"><div style="flex:1;height:48px;background:#E5484D"></div><div style="flex:1;height:48px;background:#FFE4E6"></div></div><div class="n">Error</div><div class="h">red-500 / red-50</div></div><div class="chip" style="width:140px"><div style="display:flex;border-radius:8px;overflow:hidden;border:0.5px solid var(--border-default)"><div style="flex:1;height:48px;background:#F5A623"></div><div style="flex:1;height:48px;background:#FEF3C7"></div></div><div class="n">Warning</div><div class="h">amber-500 / amber-50</div></div><div class="chip" style="width:140px"><div style="display:flex;border-radius:8px;overflow:hidden;border:0.5px solid var(--border-default)"><div style="flex:1;height:48px;background:#3B82F6"></div><div style="flex:1;height:48px;background:#DBEAFE"></div></div><div class="n">Info</div><div class="h">info-500 / info-50</div></div></div></div></body></html>
