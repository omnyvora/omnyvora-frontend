<!DOCTYPE html>

<style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-sans);background:var(--bg-page);color:var(--text-primary);-webkit-font-smoothing:antialiased}.wrap{padding:18px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:10px}.wrap{flex-wrap:nowrap}.field{flex:1}</style></head><body><div class="wrap">
