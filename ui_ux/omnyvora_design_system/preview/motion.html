<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Motion" subtitle="durations + ease cubic-bezier(.16,1,.3,1)" viewport="700x150" -->
<html data-theme="light" data-tool="portfolio">
<head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-sans);background:var(--bg-page);color:var(--text-primary);-webkit-font-smoothing:antialiased}
  .wrap{padding:18px 22px}
  
  .bar{position:relative;height:32px;background:var(--bg-surface);border-radius:6px;overflow:hidden;border:0.5px solid var(--border-default)}
  .dot{position:absolute;top:6px;left:6px;width:20px;height:20px;border-radius:5px;background:var(--accent-primary);animation:slide var(--d) var(--ease) infinite alternate}
  @keyframes slide{to{left:calc(100% - 26px)}}

</style></head><body><div class="wrap"><div style="display:flex;flex-direction:column;gap:10px"><div style="display:flex;align-items:center;gap:12px"><div style="width:96px"><div style="font:500 11px/1.2 var(--font-sans)">duration-fast</div><div style="font:400 9.5px var(--font-mono);color:var(--text-tertiary)">120ms</div></div><div class="bar" style="flex:1"><div class="dot" style="--d:600ms"></div></div></div><div style="display:flex;align-items:center;gap:12px"><div style="width:96px"><div style="font:500 11px/1.2 var(--font-sans)">duration-base</div><div style="font:400 9.5px var(--font-mono);color:var(--text-tertiary)">180ms</div></div><div class="bar" style="flex:1"><div class="dot" style="--d:900ms"></div></div></div><div style="display:flex;align-items:center;gap:12px"><div style="width:96px"><div style="font:500 11px/1.2 var(--font-sans)">duration-slow</div><div style="font:400 9.5px var(--font-mono);color:var(--text-tertiary)">300ms</div></div><div class="bar" style="flex:1"><div class="dot" style="--d:1500ms"></div></div></div><div style="font:400 10px var(--font-mono);color:var(--text-tertiary);margin-top:2px">ease · cubic-bezier(0.16, 1, 0.3, 1)</div></div></div></body></html>
