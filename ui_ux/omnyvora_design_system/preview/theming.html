<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Per-tool theming" subtitle="One component, 3 tools, swap 2 tokens" viewport="700x175" --><html data-theme="light" data-tool="portfolio"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="../components.css">
<style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-sans);background:var(--bg-page);color:var(--text-primary);-webkit-font-smoothing:antialiased}.row{display:flex;gap:12px;padding:14px 18px}</style></head><body>
  <div class="row"><div data-theme="light" data-tool="portfolio" style="flex:1;background:var(--bg-surface);border:0.5px solid var(--border-default);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;align-items:center;justify-content:space-between"><span style="font:500 12px var(--font-sans);color:var(--text-secondary);text-transform:capitalize">portfolio</span><span class="badge badge--accent">Pro</span></div>
    <button class="btn btn--accent btn--sm" style="width:100%">Open portfolio</button>
    <div style="display:flex;align-items:center;gap:8px"><label class="switch"><input type="checkbox" checked><span class="track"></span><span class="thumb"></span></label><span style="font:400 12px var(--font-sans);color:var(--accent-text)">accent-text</span></div>
  </div><div data-theme="light" data-tool="photo" style="flex:1;background:var(--bg-surface);border:0.5px solid var(--border-default);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;align-items:center;justify-content:space-between"><span style="font:500 12px var(--font-sans);color:var(--text-secondary);text-transform:capitalize">photo</span><span class="badge badge--accent">Pro</span></div>
    <button class="btn btn--accent btn--sm" style="width:100%">Open photo</button>
    <div style="display:flex;align-items:center;gap:8px"><label class="switch"><input type="checkbox" checked><span class="track"></span><span class="thumb"></span></label><span style="font:400 12px var(--font-sans);color:var(--accent-text)">accent-text</span></div>
  </div><div data-theme="dark" data-tool="productivity" style="flex:1;background:var(--bg-surface);border:0.5px solid var(--border-default);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;align-items:center;justify-content:space-between"><span style="font:500 12px var(--font-sans);color:var(--text-secondary);text-transform:capitalize">productivity</span><span class="badge badge--accent">Pro</span></div>
    <button class="btn btn--accent btn--sm" style="width:100%">Open productivity</button>
    <div style="display:flex;align-items:center;gap:8px"><label class="switch"><input type="checkbox" checked><span class="track"></span><span class="thumb"></span></label><span style="font:400 12px var(--font-sans);color:var(--accent-text)">accent-text</span></div>
  </div></div>
</body></html>
