<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Semantic tokens — dark" subtitle="Inverted hierarchy, same names" viewport="700x130" -->
<html data-theme="dark" data-tool="portfolio">
<head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-sans);background:var(--bg-page);color:var(--text-primary);-webkit-font-smoothing:antialiased}
  .wrap{padding:18px 22px}
  
</style></head><body><div class="wrap"><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px"><div style="display:flex;flex-direction:column;gap:5px"><div style="height:40px;border-radius:7px;background:var(--bg-page);border:0.5px solid var(--border-strong)"></div><div style="font:500 9.5px/1.25 var(--font-sans);color:var(--text-secondary)">bg-page</div></div><div style="display:flex;flex-direction:column;gap:5px"><div style="height:40px;border-radius:7px;background:var(--bg-surface);border:0.5px solid var(--border-strong)"></div><div style="font:500 9.5px/1.25 var(--font-sans);color:var(--text-secondary)">bg-surface</div></div><div style="display:flex;flex-direction:column;gap:5px"><div style="height:40px;border-radius:7px;background:var(--bg-surface-raised);border:0.5px solid var(--border-strong)"></div><div style="font:500 9.5px/1.25 var(--font-sans);color:var(--text-secondary)">bg-surface-raised</div></div><div style="display:flex;flex-direction:column;gap:5px"><div style="height:40px;border-radius:7px;background:var(--border-default);border:0.5px solid var(--border-strong)"></div><div style="font:500 9.5px/1.25 var(--font-sans);color:var(--text-secondary)">border-default</div></div><div style="display:flex;flex-direction:column;gap:5px"><div style="height:40px;border-radius:7px;background:var(--border-strong);border:0.5px solid var(--border-strong)"></div><div style="font:500 9.5px/1.25 var(--font-sans);color:var(--text-secondary)">border-strong</div></div><div style="display:flex;flex-direction:column;gap:5px"><div style="height:40px;border-radius:7px;background:var(--text-primary);border:0.5px solid var(--border-strong)"></div><div style="font:500 9.5px/1.25 var(--font-sans);color:var(--text-secondary)">text-primary</div></div><div style="display:flex;flex-direction:column;gap:5px"><div style="height:40px;border-radius:7px;background:var(--text-secondary);border:0.5px solid var(--border-strong)"></div><div style="font:500 9.5px/1.25 var(--font-sans);color:var(--text-secondary)">text-secondary</div></div><div style="display:flex;flex-direction:column;gap:5px"><div style="height:40px;border-radius:7px;background:var(--text-tertiary);border:0.5px solid var(--border-strong)"></div><div style="font:500 9.5px/1.25 var(--font-sans);color:var(--text-secondary)">text-tertiary</div></div><div style="display:flex;flex-direction:column;gap:5px"><div style="height:40px;border-radius:7px;background:var(--accent-primary);border:0.5px solid var(--border-strong)"></div><div style="font:500 9.5px/1.25 var(--font-sans);color:var(--text-secondary)">accent-primary</div></div><div style="display:flex;flex-direction:column;gap:5px"><div style="height:40px;border-radius:7px;background:var(--accent-subtle);border:0.5px solid var(--border-strong)"></div><div style="font:500 9.5px/1.25 var(--font-sans);color:var(--text-secondary)">accent-subtle</div></div></div></div></body></html>
