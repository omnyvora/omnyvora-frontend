# docker-compose.prod.yml

services:
  frontend:
    image: softvence/omnyvora_frontend:${IMAGE_TAG:-latest}
    container_name: ov_frontend
    env_file:
      - .env
    environment:
      NODE_ENV: production
    restart: unless-stopped
    networks:
      - ov_network

  nginx:
    image: nginx:stable-alpine
    container_name: ov_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
    restart: unless-stopped
    networks:
      - ov_network

networks:
  ov_network:
    driver: bridge
